<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FOURWARD · 협동 운동회</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23b45128'/%3E%3Ctext x='9' y='30' font-size='30' font-family='sans-serif' font-weight='bold'%3E4%3C/text%3E%3C/svg%3E"><style>
:root{--bg:#faf2e3;--panel:#fffaf0;--line:#ddc9ac;--muted:#79644d;--text:#392c23;--lime:#b45128;--c0:#b45128;--c1:#457a83;--c2:#ae7020;--c3:#79723b;--c4:#a54b59}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,'Malgun Gothic',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);color:var(--text);background:#f2e2ca;border-radius:8px;padding:10px 16px;font-weight:700}button:hover{border-color:var(--lime)}button:disabled{opacity:.4;cursor:default}.primary{background:var(--lime);color:#fffaf0;border-color:var(--lime)}input,select{border:1px solid var(--line);border-radius:8px;padding:11px;background:#fffdf7;color:var(--text);max-width:100%}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:3px}header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}.brand{font-weight:950;font-style:italic;font-size:25px;letter-spacing:-1px}.brand span{color:var(--lime)}.tag{font-size:12px;letter-spacing:.12em;color:var(--lime);border:1px solid #c88d50;padding:5px 10px;border-radius:30px}.muted{color:var(--muted)}.small{font-size:13px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.wrap{max-width:1500px;margin:auto;padding:28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:16px}h1{font-size:clamp(28px,4vw,42px);line-height:1.2;margin:8px 0 12px;letter-spacing:-1.5px}h2{font-size:20px;margin:0 0 10px}h3{font-size:16px;margin:0 0 8px}p{margin:8px 0 15px}.eyebrow{color:var(--lime);font-size:12px;letter-spacing:.13em;font-weight:800}.teams{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:12px;margin-top:20px}.teamcard{border:1px solid var(--line);border-top:4px solid var(--team);border-radius:12px;background:var(--panel);padding:16px;min-width:0}.teamcard h2{color:var(--team)}.slot{padding:12px 8px;border-bottom:1px solid var(--line);min-height:50px;overflow-wrap:anywhere}.empty{color:#86745d}.wide{width:100%}.badge{background:#eddfc6;padding:4px 8px;border-radius:5px;font-size:12px}.layout{display:grid;grid-template-columns:240px 1fr;gap:22px}.sidebar{display:flex;flex-direction:column;gap:9px}.status{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--team);border-radius:10px;padding:13px;cursor:pointer}.status.active{outline:1px solid var(--team)}.status h3{color:var(--team)}.status ul{padding:0;margin:8px 0;list-style:none;font-size:13px;color:var(--muted)}.status li{display:flex;justify-content:space-between}.progress{height:6px;background:#e4d4b8;border-radius:5px;overflow:hidden;margin:9px 0}.progress i{height:100%;background:var(--team,var(--lime));display:block}.arena{border:1px solid var(--line);border-radius:16px;background:#fffaf0;overflow:hidden}.arenahead{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.clock{font:800 28px monospace;color:var(--lime)}.stagebody{padding:24px;min-height:340px}.stagegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}.pane{background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:15px}.pane h3{color:var(--team)}.maze{display:grid;grid-template-columns:repeat(11,1fr);gap:1px;aspect-ratio:1;margin-top:12px}.cell{background:#f2dfb9;position:relative}.wall{background:#8c6447}.exit{background:#6b8b50}.avatar{background:var(--team);border-radius:50%;position:absolute;inset:12%}.track{height:12px;border-radius:8px;background:#e6d4b6;margin:18px 0}.track i{display:block;height:100%;background:var(--team);border-radius:8px}.pattern{display:flex;gap:7px;justify-content:center;margin:18px 0}.arrow{display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;width:44px;height:48px;font-size:26px}.arrow.hit{background:var(--lime);color:#fffaf0}.arrow.beat{outline:3px solid #fff}.big{font-size:48px;text-align:center;font-weight:900;line-height:1.2}.rope{height:110px;position:relative;overflow:hidden;margin:12px 0}.rope-line{position:absolute;left:0;right:0;height:4px;background:var(--team);box-shadow:0 0 12px var(--team)}.people{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:space-around;font-size:27px}.targetbar{position:relative;height:30px;background:#e3d0b2;border-radius:7px;overflow:hidden;margin:8px 0 18px}.targetbar .zone{position:absolute;left:39%;width:22%;height:100%;background:#c89440}.targetbar .bull{position:absolute;left:47.5%;width:5%;height:100%;background:var(--lime)}.targetbar .needle{position:absolute;height:100%;width:4px;background:white;box-shadow:0 0 5px #fff}.gourd{width:100px;height:100px;border-radius:50%;margin:16px auto;border:5px solid var(--team);display:grid;place-items:center;font-size:25px;font-weight:900;background:#f5e3c2}.controller{padding:20px 24px;background:#f5ead5;border-top:1px solid var(--line)}.controls{display:flex;gap:10px;justify-content:center;margin-top:15px}.key{min-width:60px;min-height:56px;font-size:22px;touch-action:manipulation}.space{min-width:200px}.notice{padding:12px 16px;background:#f3e4c7;border-left:3px solid var(--lime);border-radius:5px;margin:15px 0}.warning{background:#f8e3ce;border-color:#b5682e}.stages{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 24px}.stages span{color:var(--muted);border:1px solid var(--line);padding:6px 10px;border-radius:6px;font-size:13px}.stages .on{color:var(--lime);border-color:#c58a4d}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line)}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#5d3b25;color:#fffaf0;padding:12px 20px;border-radius:9px;z-index:10;max-width:90%;display:none}.connection{font-size:13px}.offline{color:#a43926}label{display:block;font-size:14px;margin-bottom:7px}.join{max-width:570px;margin:60px auto}.footer{margin-top:24px;font-size:12px;color:#79644d}details{margin-top:16px}summary{cursor:pointer;color:var(--muted)}@media(max-width:1050px){.teams{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:200px 1fr}}@media(max-width:700px){header{padding:14px}.wrap{padding:16px}.teams{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,1fr)}.stagebody{padding:15px}.stagegrid{grid-template-columns:1fr 1fr}.arenahead{padding:15px}.pattern{gap:3px}.arrow{width:32px;height:40px}.clock{font-size:21px}}@media(max-width:420px){.stagegrid{grid-template-columns:1fr}}

</style></head><body><header><div class="brand">FOUR<span>WARD</span> <span class="small" style="font-style:normal;color:#79644d;letter-spacing:0">가을 운동회</span></div><div class="row"><span class="tag">AUTUMN SPORTS DAY</span><span id="connection" class="connection">연결 중</span></div></header><div class="wrap"><div id="app"></div><div class="footer">서버 기준 판정 · 조당 1~4명 · 최대 5개 조 · PC는 방향키/Space, 휴대폰은 화면 버튼</div></div><div id="toast" role="status"></div><script>
'use strict';
const titles=['협동 미로 탈출','랜덤 리듬 계주','변속 단체 줄넘기','박 터뜨리기'];
const desc=['조마다 다른 15×15 미로! 담당 방향을 협동해 출구를 찾으세요. 최단 경로 길이는 동일합니다.','현재 주자만 방향키와 SPACE를 입력하세요. 7개 입력 · 0.48초 박자 · ±0.16초 판정.','조별 8박 변속 패턴을 읽고 Space! ±0.12초 판정으로 진행도 24에 도전하세요.','중앙에서 가속하는 타겟 바! 1.6초 주기 · 좁아진 중앙을 정확히 노리세요.'];
const arrows={U:'↑',D:'↓',L:'←',R:'→',S:'SPACE'};
let token=localStorage.getItem('fourward-token')||'', S=null, lastSignature='', selectedTeam=null, baseTime=0, basePerf=0, rtt=0, online=false;
const app=document.getElementById('app');
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._timer);t._timer=setTimeout(()=>t.style.display='none',4000)}
async function act(action,data={}){try{const response=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json','X-Player':token},body:JSON.stringify({action,...data})});const result=await response.json();if(!response.ok)throw Error(result.error);if(result.token){token=result.token;localStorage.setItem('fourward-token',token);lastSignature=''}await poll();return true}catch(err){toast(err.message||'연결을 확인하세요.');return false}}
function serverNow(){return S?.paused?S.now:baseTime+(performance.now()-basePerf)/1000}
async function poll(){if(poll.busy)return;poll.busy=true;try{const before=performance.now();const response=await fetch('/api/state',{headers:{'X-Player':token},signal:AbortSignal.timeout(4000)});if(!response.ok)throw Error('연결 오류');const data=await response.json();rtt=performance.now()-before;baseTime=data.now+rtt/2000;basePerf=performance.now();S=data;online=true;document.getElementById('connection').textContent=`연결됨 · ${Math.round(rtt)}ms`;document.getElementById('connection').className='connection';if(token&&!S.known){token='';localStorage.removeItem('fourward-token');toast('서버가 재시작되었습니다. 다시 입장하세요.')}const sig=JSON.stringify({...S,now:0,waiting:S.waiting,lobby:S.lobby});if(sig!==lastSignature){lastSignature=sig;render()}}catch(err){online=false;document.getElementById('connection').textContent='서버 연결 끊김 · 재연결 중';document.getElementById('connection').className='connection offline';if(!S)joinScreen()}finally{poll.busy=false}}
function joinScreen(){if(app.querySelector('#name'))return;app.innerHTML=`<section class="card join"><div class="eyebrow">TEAMWORK MAKES THE FINISH LINE</div><h1>같이 눌러야,<br>함께 도착합니다.</h1><p class="muted">협동 미로부터 박 터뜨리기까지.<br>이름을 입력하고 우리 조에 합류하세요.</p><form id="joinForm"><label for="name">참가자 이름</label><input id="name" name="name" maxlength="24" required placeholder="김싸피" class="wide" autocomplete="nickname"><button class="primary wide" style="margin-top:12px">대기실 입장 →</button></form><div class="notice small">서버 PC와 같은 네트워크에서 접속해 주세요. 사회자도 먼저 이름으로 입장합니다.</div></section>`;document.getElementById('joinForm').onsubmit=ev=>{ev.preventDefault();act('join',{name:document.getElementById('name').value})}}
function people(list){return list.map(p=>`<span class="badge ${p.online?'':'offline'}">${e(p.name)}${p.ai?' · AI':''}${p.me?' · 나':''}${p.online?'':' · 연결 끊김'}</span>`).join(' ')}
function render(){if(!token||!S?.known){joinScreen();return}if(S.phase==='lobby')lobby();else match()}
function lobby(){const focus=document.activeElement?.id;const pin=document.getElementById('pin')?.value||'';app.innerHTML=`<div class="row between"><div><div class="eyebrow">LOBBY / TEAM SELECTION</div><h1>우리 팀을 완성하세요</h1><p class="muted">빈자리의 ＋ 버튼으로 참여하세요. 사회자도 조에 들어가 함께 플레이할 수 있습니다.</p></div><span class="badge">사회자: ${e(S.host_name||'아직 없음')}</span></div><section class="card"><div class="row between"><div><h2>대기 인원 · ${S.waiting.length}명</h2><div class="row">${people(S.waiting)||'<span class="muted">대기 중인 참가자가 없습니다.</span>'}</div></div><button onclick="act('spectate')">조에서 나가기 / 대기로</button></div></section><div class="row between"><h2>조 편성 <span class="muted small">각 1~4명 · 1개 조부터 진행 가능</span></h2>${S.host?`<div class="row"><select aria-label="조 수" onchange="act('count',{count:+this.value})">${[2,3,4,5].map(n=>`<option ${S.team_count===n?'selected':''}>${n}</option>`).join('')}</select><button onclick="act('shuffle')">⤨ 랜덤 섞기</button><button onclick="act('clear_ai')">임시 AI 전체 제거</button><button class="primary" onclick="act('start_play')">${S.my_team===null?'플레이어로 참가하고 시작 →':'우리 조로 경기 시작 →'}</button>${S.my_team===null?'<button onclick="act(\'start\')">관전으로 시작</button>':''}</div>`:''}</div><div class="teams" style="--cols:${S.team_count}">${S.lobby.map((list,i)=>`<section class="teamcard" style="--team:var(--c${i})"><div class="row between"><h2>${i+1}조</h2><span class="badge">${list.length}/4</span></div>${[0,1,2,3].map(j=>list[j]?`<div class="slot">${e(list[j].name)} ${list[j].ai?'· AI ':''}${list[j].me?'(나)':''}<span class="small muted">${list[j].online?'':' · 오프라인'}</span></div>`:`<div class="slot empty"><button class="wide" onclick="act('team',{team:${i}})">＋ 참여</button></div>`).join('')}${S.host?`<div class="row" style="margin-top:10px"><button ${list.length>=4?'disabled':''} onclick="act('add_ai',{team:${i}})">＋ 임시 AI</button><button ${list.some(p=>p.ai)?'':'disabled'} onclick="act('remove_ai',{team:${i}})">AI 1명 제거</button></div>`:''}</section>`).join('')}</div>${S.host?'<div class="notice small">임시 AI는 테스트용 자동 참가자입니다. 한 조에 본인 또는 AI 한 명만 있어도 시작할 수 있습니다. 총 2~3명도 조를 나눠 경기할 수 있습니다. 직접 플레이하려면 빈자리의 ＋ 참여를 누르세요. 미로에서는 AI 담당 방향만 자동으로 움직입니다. 대기실에서 제거할 수 있으며 서버 종료 시 사라집니다.</div>':''}${!S.host&&!S.host_name?`<section class="card" style="margin-top:20px"><h2>사회자석</h2><p class="small muted">서버 실행 창에 표시된 PIN을 입력하세요. 현재 조를 유지하며 사회자와 플레이어를 겸할 수 있습니다.</p><div class="row"><input type="password" id="pin" aria-label="사회자 PIN" placeholder="사회자 PIN" value="${e(pin)}"><button onclick="act('host',{pin:document.getElementById('pin').value})">사회자로 참여</button></div></section>`:''}<details><summary>진행 및 인원 보정 규칙</summary><div class="card"><p>미로: 1명은 모든 방향, 3명은 한 명이 상하, 2명은 상하/좌우를 나눠 맡습니다. 계주: 방향키와 SPACE를 섞은 7개 입력으로 8구간을 통과합니다. 줄넘기: 조별 변속 패턴에서 성공 인원/팀 인원만큼 누적하여 24를 달성합니다. 박 체력: 팀 인원 × 180, 바는 중앙에서 가속합니다.</p><p>각 조는 순서대로 경기하며 조별 제한시간은 3분입니다. 조별 완주 시간이 짧은 순서로 100/80/60/40/20점. 미완주 팀은 진행률로 순위를 정합니다. 동률은 공동 순위, 동일 점수입니다. 인원 차이 보정은 시험용이며 미로의 소통 난도 차이는 남습니다.</p><p>랜덤 섞기는 온라인 참가자 전원을 배정합니다. 서버 재시작 시 경기 기록은 초기화됩니다.</p></div></details>`;if(focus==='pin'){const input=document.getElementById('pin');input?.focus()}}
function match(){selectedTeam=S.active_team;const own=S.teams.find(t=>t.id===S.my_team);app.innerHTML=`<div class="row between"><div><div class="eyebrow">${S.phase==='results'?'STAGE RESULTS':'LIVE MATCH'} / ${S.stage+1} OF 4</div><h1>${titles[S.stage]}</h1></div><div class="row">${S.host?`<button onclick="act('resetConfirm')" id="resetButton">대기실로</button>${S.phase==='playing'?`<button onclick="act('pause')">${S.paused?'▶ 재개':'Ⅱ 일시정지'}</button>`:S.stage<3?'<button class="primary" onclick="act(\'start\')">다음 스테이지 →</button>':''}`:''}</div></div><div class="stages">${titles.map((n,i)=>`<span class="${i===S.stage?'on':''}">0${i+1} ${n}</span>`).join('')}</div><div class="layout"><aside class="sidebar">${S.teams.map(t=>`<section class="status ${selectedTeam===t.id?'active':''}" style="--team:var(--c${t.id})"><div class="row between"><h3>${t.id+1}조 ${S.my_team===t.id?'· MY TEAM':''}</h3><strong>${t.score}점</strong></div><ul>${t.members.map(p=>`<li><span>${e(p.name)}${p.ai?' · AI':''}${p.me?' · 나':''}</span><span class="${p.online?'':'offline'}">${p.online?'접속':'끊김'}</span></li>`).join('')}</ul><div class="progress"><i style="width:${Math.round(t.progress*100)}%"></i></div><div class="small muted">${t.status==='waiting'?'순서 대기':t.completed?(t.finish!==null?'완주 '+t.finish.toFixed(1)+'초':'시간 종료 · '+Math.round(t.progress*100)+'%'):Math.round(t.progress*100)+'% 진행'}</div><div class="small">${e(t.feedback)}</div></section>`).join('')}</aside><section><div class="arena"><div class="arenahead"><div><strong>${S.phase==='results'?'경기 결과':(S.active_team+1)+'조 경기 중계'}</strong><div class="small muted">${S.phase==='results'?'순위와 누적 점수를 확인하세요.':desc[S.stage]}</div></div><div class="clock" id="clock"></div></div><div class="stagebody">${S.phase==='results'?results():arena()}</div><div class="controller">${S.phase==='results'?'<p class="muted">'+(S.stage<3?'사회자가 다음 경기를 시작하면 자동으로 이동합니다.':'모든 경기가 끝났습니다. 수고하셨습니다!')+'</p>':controller(own)}</div></div></section></div>`;const reset=document.getElementById('resetButton');if(reset)reset.onclick=()=>{if(confirm('모든 경기 점수를 초기화하고 대기실로 돌아갈까요?'))act('reset')};animate()}
function selectTeam(id){selectedTeam=id;match()}
function arena(){const t=S.teams.find(t=>t.id===S.active_team);if(!t)return '';const next=S.teams.find(q=>q.status==='waiting');return `<div class="turn-banner"><strong>${t.id+1}조 차례</strong> · ${S.teams.findIndex(q=>q.id===t.id)+1} / ${S.teams.length}번째 경기 <span class="small">${next?'다음: '+(next.id+1)+'조':'마지막 조입니다'}</span></div><div class="stagegrid"><section class="pane" style="--team:var(--c${t.id})"><div class="row between"><h3>${t.id+1}조</h3><span class="badge">LIVE</span></div>${S.stage===0?maze(t):S.stage===1?relay(t):S.stage===2?rope(t):gourd(t)}</section></div>`}
function maze(t){return `<div class="maze" style="grid-template-columns:repeat(${t.maze.length},1fr)">${t.maze.map((row,y)=>row.map((v,x)=>`<div class="cell ${v?'wall':''} ${x===t.goal[0]&&y===t.goal[1]?'exit':''}">${t.pos[0]===x&&t.pos[1]===y?'<i class="avatar"></i>':''}</div>`).join('')).join('')}</div><p class="small muted">${t.id+1}조 전용 미로 · 녹색 칸이 출구입니다. 최단 ${t.path_length}칸.</p>`}
function relay(t){if(t.finish!==null)return '<div class="big">완주!</div>';return `<div class="small muted">현재 주자</div><strong>${e(t.runner)}</strong><div class="big" data-relay="${t.id}">3</div><div class="pattern">${t.pattern.map((k,i)=>`<span class="arrow ${k==='S'?'space-note':''} ${t.hits.includes(i)?'hit':''}" data-note="${t.id}-${i}">${k==='S'?'SPACE':arrows[k]}</span>`).join('')}</div><div class="small muted">${t.relay_done}/8 구간 완료${t.bad?' · 이번 구간 실패':''}</div>`}
function rope(t){return `<div class="big">${t.rope_progress.toFixed(1)}<span class="small muted"> / ${S.rules.rope_target}</span></div><svg class="rope-scene" viewBox="0 0 600 260" role="img" aria-label="박자에 맞춰 회전하는 줄과 참가자의 점프"><path d="M35 225H565 M35 235H565" stroke="#c2a77b" stroke-width="2"/><path class="rope-cord" data-rope-back="${t.id}"/><g>${t.members.map((p,i)=>{const x=130+i*(340/Math.max(1,t.members.length-1));return `<ellipse cx="${x}" cy="218" rx="23" ry="5" fill="#76532c" opacity=".15"/><g transform="translate(${x},0)"><g class="jumper" data-jumper="${t.id}-${i}"><circle cx="0" cy="127" r="13" fill="#e9b881"/><path d="M-13 118Q0 105 13 118" fill="var(--team)"/><path d="M-14 151Q0 141 14 151L12 180H-12Z"/><path class="limb" d="M-13 153L-26 170M13 153L26 170M-7 180L-10 211M7 180L10 211"/></g></g><text x="${x}" y="250" text-anchor="middle" font-size="12" fill="#70573b">${e(p.name)}</text>`}).join('')}</g><path class="rope-cord" data-rope-front="${t.id}"/><circle cx="55" cy="155" r="7" fill="#815333"/><circle cx="545" cy="155" r="7" fill="#815333"/></svg><p class="rope-hint small">줄이 발밑의 선에 닿을 때 SPACE · 캐릭터는 실제 입력에 맞춰 점프합니다</p><div class="rope-pattern" aria-label="조별 8박 패턴">${t.rope_pattern.map((seconds,i)=>`<span class="badge ${i===t.beat_index%8?'on':''}" data-rope-note="${i}">${Math.round(60/seconds)}<small> BPM</small></span>`).join('')}</div><div class="row between"><strong>${t.bpm} BPM</strong><span class="small muted">${t.change_in<=2?`${t.change_in}박 후 ${t.next_bpm} BPM`:'리듬을 맞추세요'}</span></div>`}
function gourd(t){return `<div class="gourd">${t.health===0?'POP!':Math.ceil(t.health/(S.rules.gourd_hp*t.members.length)*100)+'%'}</div><div class="progress"><i style="width:${100*(1-t.progress)}%"></i></div><div class="small muted">남은 체력 ${t.health} / ${S.rules.gourd_hp*t.members.length}</div><div class="targetbar" aria-label="첫 번째 주자의 중앙 가속 타겟 바"><i class="zone"></i><i class="bull"></i><i class="needle" data-target-slot="0"></i></div><p class="small muted">첫 번째 주자 바 중계 · 중앙에서 속도 ×3</p>`}
function controller(t){if(S.host&&!t)return `<div class="notice"><strong>현재 관전 중입니다.</strong> ${S.teams.some(q=>!q.completed&&q.members.some(p=>p.ai))?`<button class="primary" onclick="act('take_ai')">AI 자리로 플레이 참가</button>`:'대기실로 돌아가 조에 참여한 뒤 시작해 주세요.'}</div>`;if(!t)return '<p class="muted">관전 중입니다. 다음 경기 편성은 대기실에서 참여할 수 있습니다.</p>';if(t.status!=='active')return `<div class="notice">${t.completed?'우리 조 경기가 끝났습니다.':'우리 조 순서를 기다려 주세요.'} 현재 ${S.active_team+1}조 경기 중입니다.</div>`;let role=S.stage===0?(t.members.length===1?[['U','D','L','R']]:t.members.length===2?[['U','D'],['L','R']]:t.members.length===3?[['U','D'],['L'],['R']]:[['U'],['D'],['L'],['R']])[S.my_slot]:S.stage===1?['U','D','L','R','S']:['S'];let label=S.stage===0?'내 담당 방향: '+role.map(k=>arrows[k]).join(' '):S.stage===1?(t.mine?'내 차례입니다!':'다른 팀원의 차례 · 준비하세요'):S.stage===2?'줄이 발밑에 올 때 점프':'중앙에 맞춰 던지기';return `<div class="row between"><strong>${t.id+1}조 · ${e(t.members[S.my_slot].name)}</strong><span class="badge">${label}</span></div>${S.stage===3?`<div class="targetbar"><i class="zone"></i><i class="bull"></i><i class="needle" id="needle"></i></div><div class="small muted">중앙 30 · 안쪽 20 · 가장자리 10 · 중앙 가속 ×3 · 회전당 한 번</div>`:''}<div class="controls">${role.map(k=>`<button class="key ${k==='S'?'space primary':''}" onpointerdown="event.preventDefault();sendKey('${k}')" ${S.stage===1&&!t.mine?'disabled':''}>${k==='S'?'SPACE / 누르기':arrows[k]}</button>`).join('')}</div><div class="small muted" style="text-align:center;margin-top:10px">길게 누르기·키 자동 반복은 입력되지 않습니다.</div>`}
function results(){const ordered=[...S.teams].sort((a,b)=>a.rank-b.rank);return `<table><thead><tr><th>순위</th><th>팀</th><th>기록</th><th>획득</th><th>합계</th></tr></thead><tbody>${ordered.map(t=>`<tr><td>${t.rank}위</td><td>${t.id+1}조</td><td>${t.finish!==null?t.finish.toFixed(1)+'초':Math.round(t.progress*100)+'% · 미완주'}</td><td>+${t.points}</td><td>${t.score}</td></tr>`).join('')}</tbody></table>${S.stage===3?`<div class="notice"><strong>종합 우승: ${S.teams.filter(t=>t.score===Math.max(...S.teams.map(q=>q.score))).map(t=>`${t.id+1}조`).join(', ')}!</strong><br>4개 스테이지 누적 점수 기준입니다. 동점은 공동 우승입니다.</div>`:''}`}
let lastInput=0;
function sendKey(key){if(!online||!S||S.phase!=='playing'||S.paused||S.my_team!==S.active_team||serverNow()<S.start)return;if(performance.now()-lastInput<65)return;lastInput=performance.now();act('input',{key,round:S.round})}
document.addEventListener('keydown',ev=>{if(['INPUT','SELECT','TEXTAREA'].includes(ev.target.tagName))return;const k={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',Space:'S'}[ev.code]||{ArrowUp:'U',ArrowDown:'D',ArrowLeft:'L',ArrowRight:'R',' ':'S',Spacebar:'S'}[ev.key];if(k&&S?.phase==='playing'){ev.preventDefault();if(!ev.repeat)sendKey(k)}});
let soundOn=false,audioContext=null,lastSound='';
const audioButton=document.createElement('button');audioButton.textContent='박자 소리 켜기';audioButton.className='small';document.querySelector('header .row').prepend(audioButton);audioButton.onclick=()=>{soundOn=!soundOn;audioButton.textContent=soundOn?'박자 소리 끄기':'박자 소리 켜기';if(soundOn)beep()};
function beep(){if(!soundOn)return;try{audioContext??=new(window.AudioContext||window.webkitAudioContext)();const o=audioContext.createOscillator(),g=audioContext.createGain();o.connect(g);g.connect(audioContext.destination);g.gain.value=.08;o.frequency.value=700;o.start();o.stop(audioContext.currentTime+.05)}catch{}}
function targetPosition(phase){const p=((phase%1)+1)%1;return p<.45?p*.35/.45:p<=.55?.35+(p-.45)*3:.65+(p-.55)*.35/.45}
function ropeClock(t,n){const pattern=t.rope_pattern,total=pattern.reduce((a,b)=>a+b,0),elapsed=Math.max(0,n-t.started),cycles=Math.floor(elapsed/total);let remaining=elapsed-cycles*total,previous=t.started+cycles*total;for(let i=0;i<pattern.length;i++){const period=pattern[i];if(remaining<period||i===pattern.length-1)return {phase:remaining/period,period,previous,beat:previous+period,index:cycles*pattern.length+i};remaining-=period;previous+=period}}
function animate(){if(!S||S.phase!=='playing')return;const n=serverNow();const clock=document.getElementById('clock');if(clock)clock.textContent=S.paused?'PAUSED':n<S.start?'시작 '+Math.ceil(S.start-n):Math.max(0,Math.ceil(S.start+S.limit-n))+'s';for(const t of S.teams){if(S.stage===1&&t.id===S.active_team&&t.finish===null){const delta=n-t.turn_start;const el=document.querySelector(`[data-relay="${t.id}"]`);if(el)el.textContent=delta<0?'준비':delta<3?Math.ceil(3-delta):'GO';for(let i=0;i<t.pattern.length;i++){document.querySelector(`[data-note="${t.id}-${i}"]`)?.classList.toggle('beat',Math.abs(n-(t.turn_start+3+i*S.rules.relay_step))<S.rules.relay_window)}}if(S.stage===2&&t.id===S.active_team){const timing=ropeClock(t,n);const angle=timing.phase*Math.PI*2;document.querySelectorAll('[data-rope-note]').forEach((el,i)=>el.classList.toggle('on',i===timing.index%8));const y=n<S.start?155:155+60*Math.cos(angle);const path=`M55 155 Q300 ${2*y-155} 545 155`;for(const side of ['back','front']){const el=document.querySelector(`[data-rope-${side}="${t.id}"]`);if(el){el.setAttribute('d',path);el.style.visibility=(side==='front')===(y>=155)?'visible':'hidden'}}t.members.forEach((p,i)=>{const el=document.querySelector(`[data-jumper="${t.id}-${i}"]`);if(!el)return;const age=n-t.jumps[i];const lift=age>=0&&age<.5?Math.sin(age/.5*Math.PI)*40:0;el.setAttribute('transform',`translate(0,${-lift})`);el.classList.toggle('hit',age>=0&&age<.5&&t.successes.includes(i))})}}document.querySelectorAll('[data-target-slot]').forEach(el=>{const phase=Math.max(0,n-S.start)/S.rules.gourd_period+Number(el.dataset.targetSlot)*.23;el.style.left=(targetPosition(phase)*100)+'%'});const needle=document.getElementById('needle');if(needle&&S.my_slot!==null){const phase=Math.max(0,n-S.start)/S.rules.gourd_period+S.my_slot*.23;needle.style.left=(targetPosition(phase)*100)+'%'}}
setInterval(()=>{animate();if(!S||S.paused||S.phase!=='playing'||serverNow()<S.start)return;const n=serverNow(),t=S.teams.find(t=>t.id===S.active_team);if(!t||t.finish!==null)return;let cue=null;if(S.stage===2){const timing=ropeClock(t,n);if(Math.abs(n-timing.beat)<.06)cue='rope'+timing.index;else if(timing.index>0&&Math.abs(n-timing.previous)<.06)cue='rope'+(timing.index-1);}if(S.stage===1){const b=Math.round((n-t.turn_start-3)/S.rules.relay_step);if(b>=0&&b<S.rules.relay_notes&&Math.abs(n-t.turn_start-3-b*S.rules.relay_step)<.06)cue='relay'+t.turn_start+'-'+b;}if(cue&&cue!==lastSound){lastSound=cue;beep()}},16);setInterval(poll,180);poll();
if(location.protocol==='file:'){app.innerHTML='<div class="card join"><h1>서버 주소로 접속해 주세요</h1><p>HTML 파일을 직접 여는 방식이 아닙니다. 같은 폴더에서 <code>python server.py</code>를 실행하고 표시된 <code>http://서버IP:8000</code> 주소를 열어주세요.</p></div>'}
</script></body></html>
